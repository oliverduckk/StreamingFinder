[project]
name = "streaming-finder"
version = "0.3.0"
description = "Find where movies and TV shows are available to stream across countries."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
