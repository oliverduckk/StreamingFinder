[project]
name = "streaming-finder"
version = "0.6.0"
description = "Local desktop app and API for movie and TV streaming availability across countries."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.10,<3",
    "PySide6>=6.9,<7",
    "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[project.scripts]
streaming-finder = "app.desktop:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
